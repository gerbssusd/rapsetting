ORY</text><rect x="545" y="300" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#1B4332" stroke-width="1.5" filter="url(#softShadow)"/><text x="640" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#1B4332" text-anchor="middle" letter-spacing="0">Events</text><text x="640" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">(plot)</text><rect x="545" y="362" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#6B2D5C" stroke-width="2.5" filter="url(#softShadow)"/><text x="640" y="382" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#6B2D5C" text-anchor="middle" letter-spacing="0">Environments</text><text x="640" y="399" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">(setting)</text><rect x="545" y="424" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#1B4332" stroke-width="1.5" filter="url(#softShadow)"/><text x="640" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#1B4332" text-anchor="middle" letter-spacing="0">Characters</text><text x="640" y="461" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">(characterisation)</text><line x1="230" y1="345" x2="296" y2="300" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="230" y1="345" x2="296" y2="453" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="984" y1="300" x2="1046" y2="345" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="984" y1="453" x2="1046" y2="345" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="490" y1="250" x2="516" y2="300" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="490" y1="453" x2="516" y2="345" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="764" y1="300" x2="786" y2="250" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="764" y1="345" x2="786" y2="453" stroke="#1B4332" stroke-width="2.5" marker-end="url(#arrow)"/><text x="640" y="660" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">Story vs. Discourse: what the narrator tells the narratee (story) vs. the whole</text><text x="640" y="684" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">communicative act from implied author to implied reader (discourse). Ribó 9–10.</text></svg>
