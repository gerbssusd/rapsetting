<text x="640" y="50" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">The Semiotic Model of Narrative</text><text x="640" y="78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#5C8374" text-anchor="middle" letter-spacing="0">adapted from Ribó, Fig. 1.5 (p. 8) · CC BY 4.0</text><rect x="40" y="300" width="190" height="90" rx="10" fill="#EAE1C8" stroke="#5C8374" stroke-width="2" filter="url(#softShadow)"/><text x="135" y="335" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">REAL AUTHOR</text><text x="135" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="135" dy="0">Nathaniel Hawthorne</tspan></text><rect x="1050" y="300" width="190" height="90" rx="10" fill="#EAE1C8" stroke="#5C8374" stroke-width="2" filter="url(#softShadow)"/><text x="1145" y="335" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">REAL READER</text><text x="1145" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="1145" dy="0">You, watching now</tspan></text><rect x="270" y="140" width="740" height="460" rx="20" fill="none" stroke="#1B4332" stroke-width="2.5" filter="url(#softShadow)"/><text x="640" y="172" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#1B4332" text-anchor="middle" letter-spacing="2">DISCOURSE</text><rect x="300" y="210" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#1B4332" stroke-width