<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4332"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B2D5C"/>
    </marker>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0E2A20" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="dread" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6B2D5C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6B2D5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF9F3"/>
      <stop offset="100%" stop-color="#F4EFE1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bgWash)"/>
<text x="640" y="46" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Freytag’s Pyramid, Applied</text><text x="640" y="70" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#5C8374" text-anchor="middle" letter-spacing="0">adapted from Ribó, Fig. 2.9 (p. 27) · CC BY 4.0</text><path d="M100,500 L330,435 L640,250 L950,435 L1180,500" fill="none" stroke="#1B4332" stroke-width="4" stroke-linejoin="round"/><path d="M100,500 L330,435 L640,250 L950,435 L1180,500 L1180,540 L100,540 Z" fill="#1B4332" opacity="0.06"/><circle cx="100" cy="500" r="9" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3"/><text x="100" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Exposition</text><text x="100" y="554" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="100" dy="0">Giovanni takes lodging</tspan><tspan x="100" dy="15">above the garden.</tspan></text><circle cx="330" cy="435" r="9" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3"/><text x="330" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Rising Action</text><text x="330" y="489" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="330" dy="0">Fascination with</tspan><tspan x="330" dy="15">Beatrice; Baglioni’s</tspan><tspan x="330" dy="15">warnings.</tspan></text><circle cx="640" cy="250" r="9" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3"/><text x="640" y="132" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="640" dy="0">Giovanni accuses</tspan><tspan x="640" dy="16">Beatrice of poisoning</tspan><tspan x="640" dy="16">him.</tspan></text><text x="640" y="218" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Climax</text><circle cx="950" cy="435" r="9" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3"/><text x="950" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Falling Action</text><text x="950" y="489" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="950" dy="0">The antidote is procured</tspan><tspan x="950" dy="15">from Baglioni.</tspan></text><circle cx="1180" cy="500" r="9" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3"/><text x="1180" y="534" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Resolution</text><text x="1180" y="554" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="1180" dy="0">Beatrice dies;</tspan><tspan x="1180" dy="15">Rappaccini’s experiment</tspan><tspan x="1180" dy="15">fails.</tspan></text><text x="640" y="690" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">Ribó: tragedy plots move “from fortune to misfortune,” turning on the protagonist’s</text><text x="640" y="714" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" font-style="italic" fill="#1B2B22" text-anchor="middle" letter-spacing="0">own flaw — here, Giovanni’s suspicion (Ribó 25–26).</text></svg>
