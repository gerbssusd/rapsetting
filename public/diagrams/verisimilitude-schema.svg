<text x="575" y="54" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Schema of Verisimilitude</text><text x="575" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#5C8374" text-anchor="middle" letter-spacing="0">adapted from Ribó, Fig. 3.8 (p. 44) · CC BY 4.0</text><line x1="180" y1="150" x2="180" y2="670" stroke="#1B4332" stroke-width="2.5"/><line x1="180" y1="410" x2="940" y2="410" stroke="#1B4332" stroke-width="2.5"/><text x="156" y="136" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="start" letter-spacing="0">VERISIMILAR</text><text x="156" y="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="start" letter-spacing="0">NON-VERISIMILAR</text><text x="160" y="396" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="end" letter-spacing="0">FICTION</text><text x="960" y="396" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="start" letter-spacing="0">NONFICTION</text><text x="370" y="210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5C8374" text-anchor="middle"><tspan x="370" dy="0">realist novels</tspan></text><text x="750" y="210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5C8374" text-anchor="middle"><tspan x="750" dy="0">reportage</tspan></text><text x="370" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5C8374" text-anchor="middle"><tspan x="370" dy="0">fantasy, fable</tspan></text><text x="750" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5C8374" text-anchor="middle"><tspan x="750" dy="0">an unbelievable</tspan><tspan x="750" dy="20">“true story”</tspan></text><circle cx="408" cy="306" r="14" fill="#6B2D5C" stroke="#FBF9F3" stroke-width="3" filter="url(#softShadow)"/><text x="408" y="276" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#4A1E40" text-anchor="middle"><tspan x="408" dy="0">“Rappaccini’s Daughter”</tspan></text><text x="408" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="408" dy="0">fantastic premise, made</tspan><tspan x="408" dy="16">verisimilar by dense</tspan><tspan x="408" dy="16">description + the “M. de</tspan><tspan x="408" dy="16">l’Aubépine” translator frame</tspan></text><text x="575" y="760" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="575" dy="0">Verisimilitude: narrative discourse’s attempt to make a storyworld feel like a</tspan><tspan x="575" dy="20">faithful imitation of the real one — true or not. Ribó 44.</tspan></text></svg>
