  <rect width="1100" height="990" fill="url(#bgWash)"/>
<text x="550" y="46" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Rappaccini’s Garden: A Topographic Sketch</text><text x="550" y="72" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5C8374" text-anchor="middle" letter-spacing="0">original schematic, composed from Hawthorne’s descriptive details</text><rect x="130" y="195" width="840" height="620" rx="18" fill="url(#dread)"/><rect x="130" y="195" width="840" height="620" rx="18" fill="none" stroke="#0E2A20" stroke-width="6"/><rect x="170" y="235" width="180" height="180" rx="14" fill="#5C8374" opacity="0.22" stroke="#5C8374" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="750" y="235" width="180" height="180" rx="14" fill="#5C8374" opacity="0.22" stroke="#5C8374" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="170" y="595" width="180" height="180" rx="14" fill="#5C8374" opacity="0.22" stroke="#5C8374" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="750" y="595" width="180" height="180" rx="14" fill="#5C8374" opacity="0.22" stroke="#5C8374" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="528" y="195" width="44" height="620" fill="#EAE1C8"/><rect x="130" y="483" width="840" height="44" fill="#EAE1C8"/><circle cx="550" cy="505" r="70" fill="#FFFFFF" stroke="#1B4332" stroke-width="3"/><circle cx="550" cy="505" r="46" fill="none" stroke="#5C8374" stroke-width="2"/><line x1="550" y1="505" x2="606.3" y2="472.5" stroke="#5C8374" stroke-width="1.5"/><line x1="550" y1="505" x2="614.0" y2="516.3" stroke="#5C8374" stroke-width="1.5"/><line x1="550" y1="505" x2="587.3" y2="558.2" stroke="#5C8374" stroke-width="1.5"/><text x="550" y="605" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" font-style="italic" fill="#0E2A20" text-anchor="middle" letter-spacing="0">the ruined marble fountain</text><circle cx="714.0" cy="495.0" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="701.2" cy="521.6" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="672.4" cy="528.1" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="649.4" cy="509.8" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="649.4" cy="480.2" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="672.4" cy="461.9" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="701.2" cy="468.4" r="16" fill="#6B2D5C" opacity="0.88"/><circle cx="680" cy="495" r="20" fill="#B08D57"/><text x="680" y="561" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" font-style="italic" fill="#4A1E40" text-anchor="middle" letter-spacing="0">the purple-gemmed shrub</text><text x="680" y="581" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#4A1E40" text-anchor="middle" letter-spacing="0">(Rappaccini approaches masked)</text><rect x="488" y="139" width="124" height="50" rx="6" fill="#0E2A20" stroke="#B08D57" stroke-width="2" filter="url(#softShadow)"/><text x="550" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">GIOVANNI’S</text><text x="550" y="179" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">WINDOW</text><line x1="550" y1="189" x2="550" y2="195" stroke="#B08D57" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="870" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="550" dy="0">Topography: the objective layout — wall, beds, path, fountain,</tspan><tspan x="550" dy="22">shrub. Atmosphere: the radial wash of unease that colors it,</tspan><tspan x="550" dy="22">filtered through Giovanni’s vantage above. Ribó 36–37.</tspan></text></svg>
