<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4332"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B2D5C"/>
    </marker>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0E2A20" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="dread" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6B2D5C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6B2D5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF9F3"/>
      <stop offset="100%" stop-color="#F4EFE1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgWash)"/>
<text x="600" y="54" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="0">Four Kinds of Setting</text><text x="600" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#5C8374" text-anchor="middle" letter-spacing="0">typology per Ribó 39–40 · applications to “Rappaccini’s Daughter” ours</text><rect x="120" y="130" width="460" height="280" rx="16" fill="#EAE1C8" stroke="#EAE1C8" stroke-width="1.5" filter="url(#softShadow)"/><rect x="120" y="130" width="460" height="56" rx="16" fill="#5C8374" opacity="0.35"/><rect x="120" y="160" width="460" height="26" fill="#5C8374" opacity="0.35"/><text x="350" y="167" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0E2A20" text-anchor="middle" letter-spacing="2">IRRELEVANT</text><text x="350" y="230" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="350" dy="0">Setting barely registers.</tspan></text><line x1="160" y1="290" x2="540" y2="290" stroke="#5C8374" stroke-width="1" opacity="0.5"/><text x="350" y="325" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5C8374" text-anchor="middle"><tspan x="350" dy="0">Not present in this story.</tspan></text><rect x="620" y="130" width="460" height="280" rx="16" fill="#FFFFFF" stroke="#1B4332" stroke-width="3" filter="url(#softShadow)"/><rect x="620" y="130" width="460" height="56" rx="16" fill="#1B4332" opacity="1"/><rect x="620" y="160" width="460" height="26" fill="#1B4332" opacity="1"/><text x="850" y="167" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FUNCTIONAL</text><text x="850" y="230" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="850" dy="0">Supplies what plot needs.</tspan></text><line x1="660" y1="290" x2="1040" y2="290" stroke="#1B4332" stroke-width="1" opacity="0.5"/><text x="850" y="325" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#1B4332" text-anchor="middle"><tspan x="850" dy="0">“The dying lizard; the falling</tspan><tspan x="850" dy="19">insect.”</tspan></text><rect x="120" y="450" width="460" height="280" rx="16" fill="#FFFFFF" stroke="#1B4332" stroke-width="3" filter="url(#softShadow)"/><rect x="120" y="450" width="460" height="56" rx="16" fill="#1B4332" opacity="1"/><rect x="120" y="480" width="460" height="26" fill="#1B4332" opacity="1"/><text x="350" y="487" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MENTAL</text><text x="350" y="550" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="350" dy="0">Filtered through a character's</tspan><tspan x="350" dy="20">mind.</tspan></text><line x1="160" y1="610" x2="540" y2="610" stroke="#1B4332" stroke-width="1" opacity="0.5"/><text x="350" y="645" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#1B4332" text-anchor="middle"><tspan x="350" dy="0">“Am I awake? Have I my senses?”</tspan></text><rect x="620" y="450" width="460" height="280" rx="16" fill="#FFFFFF" stroke="#6B2D5C" stroke-width="3" filter="url(#softShadow)"/><rect x="620" y="450" width="460" height="56" rx="16" fill="#6B2D5C" opacity="1"/><rect x="620" y="480" width="460" height="26" fill="#6B2D5C" opacity="1"/><text x="850" y="487" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SYMBOLIC</text><text x="850" y="550" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#1B2B22" text-anchor="middle"><tspan x="850" dy="0">Stages plot, character, or theme.</tspan></text><line x1="660" y1="610" x2="1040" y2="610" stroke="#6B2D5C" stroke-width="1" opacity="0.5"/><text x="850" y="645" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#6B2D5C" text-anchor="middle"><tspan x="850" dy="0">“The Eden of the present world.”</tspan></text></svg>
